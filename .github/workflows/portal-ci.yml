name: Portal CI

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/firebase-attendance-backend]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log("Audit summary:", JSON.stringify(a.metadata?.vulnerabilities)); for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": severity=" + v.severity + ", direct=" + v.isDirect + ", fix=" + JSON.stringify(v.fixAvailable));'
      - run: npm run check
      - run: npx firebase emulators:exec --only firestore --project demo-iiitt-portal "npm run test:rules"
      - run: npm run build
