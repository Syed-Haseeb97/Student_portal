name: Portal CI

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/firebase-attendance-backend]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npx firebase emulators:exec --only firestore --project demo-iiitt-portal "npm run test:rules"
      - run: npm run build
